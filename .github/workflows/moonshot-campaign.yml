name: Moonshot campaign integrity

on:
  push:
    branches: [master]
    tags: ["layercake-moonshot-final", "layercake-moonshot-successor-*"]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_docs.py
      - run: pytest -q
      - name: Verify an immutable release tag or report development state
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python -m layercake.moonshot_campaign verify-all
          else
            python -m layercake.moonshot_campaign status
            echo "Current master is a post-release development lineage; sealed verification runs only on an immutable release tag."
          fi
