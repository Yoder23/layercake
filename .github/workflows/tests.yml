name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run paste losslessness test
        run: pytest tests/test_paste_lossless.py -v

      - name: Check public documentation and CLI discovery
        run: |
          python scripts/check_docs.py
          python -m layercake --help

      - name: Run rolling-training smoke tests
        run: |
          python -m layercake.rolling.cli --help
          python scripts/demo_rolling_training.py --smoke
          python scripts/demo_preview_guided_layercake_training.py --smoke

      # The Tier 1 timing benchmark is intentionally not a CI pass/fail gate.
      # Shared-runner timing is noisy, while the benchmark itself correctly
      # exits nonzero when a scientific dominance gate is missed. Its portable
      # schema and fail-closed gates are exercised by the pytest suite below.
      - name: Run portable test suite
        run: |
          pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check layercake/__init__.py layercake/__main__.py layercake/cake \
            layercake/routing/orchestrator.py tests/test_main_cli.py scripts/check_docs.py
