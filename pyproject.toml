[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "layercake"
version = "0.1.0"
description = "Modular language models via a fixed-dimension ABI bottleneck"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Sam Yoder"}]
keywords = ["machine-learning", "language-model", "modular-ai", "model-serving"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<2",
    "safetensors>=0.4",
    "cryptography>=42",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.19",
    "transformers>=4.38",
]
tokenizer = [
    "sentencepiece>=0.1.99",
]
external-tokenizer = [
    "tokenizers>=0.19",
]

[project.urls]
Homepage = "https://github.com/Yoder23/layercake"
Documentation = "https://github.com/Yoder23/layercake/tree/master/docs"
Issues   = "https://github.com/Yoder23/layercake/issues"

[project.scripts]
layercake = "layercake.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["layercake*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
